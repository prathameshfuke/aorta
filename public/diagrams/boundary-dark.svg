<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560" role="img" aria-label="What leaves your machine: the Claude model receives the files Claude opens and script output; the compared models receive fixture prompts only in live parity; provider documentation pages are fetched to confirm dates."><rect width="480" height="560" rx="16" fill="#0D1117"/><rect x="16" y="16" width="448" height="180" rx="12" fill="#161B22" stroke="#3F3F46" stroke-dasharray="6 5"/><text x="34" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Your machine or CI runner</text><rect x="34" y="64" width="128" height="62" rx="12" fill="#0D1117" stroke="#3F3F46"/><text x="98" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#F4F3EF">Repository</text><text x="98" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#A1A1AA">your code</text><rect x="176" y="64" width="128" height="62" rx="12" fill="#0D1117" stroke="#3F3F46"/><text x="240" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#F4F3EF">Scripts</text><text x="240" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#A1A1AA">scan, plan, parity</text><rect x="318" y="64" width="128" height="62" rx="12" fill="#0D1117" stroke="#3F3F46"/><text x="382" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#F4F3EF">API keys</text><text x="382" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="middle" fill="#A1A1AA">from environment</text><text x="34" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">Claude Code runs here. The Claude model does not.</text><text x="34" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">In the Claude apps, this box is a hosted sandbox.</text><path d="M34 196V496" fill="none" stroke="#F4F3EF" stroke-width="2"/><path d="M34 272H62" fill="none" stroke="#F4F3EF" stroke-width="2"/><path d="M56 267L63 272L56 277" fill="none" stroke="#F4F3EF" stroke-width="2"/><rect x="66" y="224" width="398" height="96" rx="12" fill="#161B22" stroke="#3F3F46"/><text x="84" y="249" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#F4F3EF">Claude model</text><text x="84" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">Files Claude opens and what the scripts print.</text><text x="84" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">That can include code and fixtures.</text><text x="84" y="307" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" fill="#F4F3EF">Whenever Claude runs the skill</text><path d="M34 384H62" fill="none" stroke="#F4F3EF" stroke-width="2"/><path d="M56 379L63 384L56 389" fill="none" stroke="#F4F3EF" stroke-width="2"/><rect x="66" y="336" width="398" height="96" rx="12" fill="#161B22" stroke="#3F3F46"/><text x="84" y="361" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#F4F3EF">The two models being compared</text><text x="84" y="382" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">Fixture prompts, sent with your API key.</text><text x="84" y="399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">Nothing else from the repository.</text><text x="84" y="419" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" fill="#F4F3EF">Only with parity.py --live</text><path d="M34 496H62" fill="none" stroke="#F4F3EF" stroke-width="2"/><path d="M56 491L63 496L56 501" fill="none" stroke="#F4F3EF" stroke-width="2"/><rect x="66" y="448" width="398" height="96" rx="12" fill="#161B22" stroke="#3F3F46"/><text x="84" y="473" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#F4F3EF">Provider documentation pages</text><text x="84" y="494" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">A page request to confirm a date.</text><text x="84" y="511" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">No repository content.</text><text x="84" y="531" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" text-anchor="start" fill="#F4F3EF">Only if Claude has web tools</text></svg>
