<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" width="480" height="610" role="img" aria-label="Parity verdict: six checks produce fail, warn or pass. A pull request is ready only after a live pass for every replaced model with the patch applied."><rect width="480" height="610" rx="16" fill="#FFFFFF"/><text x="24" y="38" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Each fixture, old model against new</text><rect x="16" y="56" width="448" height="216" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="36" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#111111">Schema-valid</text><text x="444" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">at least 100%</text><path d="M36 96H444" fill="none" stroke="#D4D4D8" stroke-width="1"/><text x="36" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#111111">Label agreement</text><text x="444" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">at least 95%</text><path d="M36 130H444" fill="none" stroke="#D4D4D8" stroke-width="1"/><text x="36" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#111111">Numeric drift</text><text x="444" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">at most 5%</text><path d="M36 164H444" fill="none" stroke="#D4D4D8" stroke-width="1"/><text x="36" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#111111">Regex</text><text x="444" y="186" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">every fixture matches</text><path d="M36 198H444" fill="none" stroke="#D4D4D8" stroke-width="1"/><text x="36" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#111111">Cost</text><text x="444" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">at most +25%</text><path d="M36 232H444" fill="none" stroke="#D4D4D8" stroke-width="1"/><text x="36" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#111111">Latency</text><text x="444" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">shown, never fails</text><text x="24" y="292" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#52525B">Defaults. Change them under parity: in policy.yaml.</text><path d="M240 306V330M86 358V330H394V358M240 330V358" fill="none" stroke="#111111" stroke-width="2"/><path d="M81 352L86 358L91 352" fill="none" stroke="#111111" stroke-width="2"/><rect x="16" y="360" width="140" height="108" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="86" y="387" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#92400E">fail</text><text x="86" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">A threshold failed.</text><text x="86" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Exit code 2.</text><text x="86" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Stays a draft.</text><path d="M235 352L240 358L245 352" fill="none" stroke="#111111" stroke-width="2"/><rect x="170" y="360" width="140" height="108" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="240" y="387" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#111111">warn</text><text x="240" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Something unchecked</text><text x="240" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">or costlier.</text><text x="240" y="448" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Stays a draft.</text><path d="M389 352L394 358L399 352" fill="none" stroke="#111111" stroke-width="2"/><rect x="324" y="360" width="140" height="108" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="394" y="387" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#2D704C">pass</text><text x="394" y="412" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Every check ran</text><text x="394" y="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">and passed.</text><path d="M394 468V500" fill="none" stroke="#111111" stroke-width="2"/><path d="M389 494L394 500L399 494" fill="none" stroke="#111111" stroke-width="2"/><rect x="16" y="502" width="448" height="92" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="36" y="533" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#111111">Ready for review needs all of this</text><text x="36" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#52525B">A live pass for every replaced model, with the</text><text x="36" y="574" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#52525B">patch applied. A simulated run never counts.</text></svg>
