<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 362" width="480" height="362" role="img" aria-label="Policy decision: the first matching rule marks a site allow, ask or deny. With no matching rule it is ask."><rect width="480" height="362" rx="16" fill="#FFFFFF"/><rect x="150" y="16" width="180" height="46" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="240" y="45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">A call site</text><path d="M240 62V94" fill="none" stroke="#111111" stroke-width="2"/><path d="M235 88L240 94L245 88" fill="none" stroke="#111111" stroke-width="2"/><rect x="92" y="96" width="296" height="62" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="240" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#111111">First matching rule in policy.yaml</text><text x="240" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">no rule matches: ask</text><path d="M240 158V186M86 214V186H394V214M240 186V214" fill="none" stroke="#111111" stroke-width="2"/><path d="M81 208L86 214L91 208" fill="none" stroke="#111111" stroke-width="2"/><rect x="16" y="216" width="140" height="128" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="86" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#2D704C">allow</text><text x="86" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">In the plan.</text><text x="86" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">--apply writes it.</text><path d="M235 208L240 214L245 208" fill="none" stroke="#111111" stroke-width="2"/><rect x="170" y="216" width="140" height="128" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="240" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#E11D48">ask</text><text x="240" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">In the plan.</text><text x="240" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Written only with</text><text x="240" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">--include-ask,</text><text x="240" y="322" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">after you approve.</text><path d="M389 208L394 214L399 208" fill="none" stroke="#111111" stroke-width="2"/><rect x="324" y="216" width="140" height="128" rx="12" fill="#FAFAFA" stroke="#D4D4D8"/><text x="394" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#92400E">deny</text><text x="394" y="268" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Reported.</text><text x="394" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">Never edited,</text><text x="394" y="304" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#52525B">whatever the flags.</text></svg>
