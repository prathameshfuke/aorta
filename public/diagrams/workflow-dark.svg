<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="480" height="580" role="img" aria-label="Breakline workflow: preflight, check dates, scan, you choose replacements, plan, prove, you approve, apply and report. A failed parity run returns to planning."><rect width="480" height="580" rx="16" fill="#0D1117"/><path d="M44 40V502" fill="none" stroke="#F4F3EF" stroke-width="2"/><circle cx="44" cy="40" r="7" fill="#0D1117" stroke="#F4F3EF" stroke-width="3"/><text x="70" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Preflight</text><text x="70" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">Policy and fixtures present?</text><text x="456" y="37" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#A1A1AA">SKILL.md</text><circle cx="44" cy="106" r="7" fill="#0D1117" stroke="#F4F3EF" stroke-width="3"/><text x="70" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Check the dates</text><text x="70" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">Which records are unverified?</text><text x="456" y="103" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#A1A1AA">verify_dates.py</text><circle cx="44" cy="172" r="7" fill="#0D1117" stroke="#F4F3EF" stroke-width="3"/><text x="70" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Scan</text><text x="70" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">Retiring calls, soonest first</text><text x="456" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#A1A1AA">scan.py</text><circle cx="44" cy="238" r="9" fill="#E11D48"/><text x="70" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Choose replacements</text><text x="70" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">You name each new model</text><text x="456" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#FB7185">you</text><circle cx="44" cy="304" r="7" fill="#0D1117" stroke="#F4F3EF" stroke-width="3"/><text x="70" y="301" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Plan</text><text x="70" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">A diff. No source file changes</text><text x="456" y="301" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#A1A1AA">plan_patch.py</text><circle cx="44" cy="370" r="7" fill="#0D1117" stroke="#F4F3EF" stroke-width="3"/><text x="70" y="367" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Prove</text><text x="70" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">Your fixtures on both models</text><text x="456" y="367" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#A1A1AA">parity.py</text><circle cx="44" cy="436" r="9" fill="#E11D48"/><text x="70" y="433" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Approve</text><text x="70" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">You read the diff and say yes</text><text x="456" y="433" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#FB7185">you</text><circle cx="44" cy="502" r="7" fill="#0D1117" stroke="#F4F3EF" stroke-width="3"/><text x="70" y="499" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#F4F3EF">Apply and report</text><text x="70" y="518" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#A1A1AA">Patch, then pr_body.md</text><text x="456" y="499" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#A1A1AA">report.py</text><path d="M262 381H290V315H270" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M277 310L270 315L277 320" fill="none" stroke="#FBBF24" stroke-width="1.5"/><text x="300" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#FBBF24">exit 2: fix</text><text x="300" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#FBBF24">and replay</text><circle cx="44" cy="552" r="7" fill="#0D1117" stroke="#F4F3EF" stroke-width="3"/><text x="70" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">A script decides</text><circle cx="214" cy="552" r="9" fill="#E11D48"/><text x="234" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#A1A1AA">Stops and waits for you</text></svg>
