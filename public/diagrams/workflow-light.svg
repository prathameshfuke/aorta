<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="480" height="580" role="img" aria-label="Breakline workflow: preflight, check dates, scan, you choose replacements, plan, prove, you approve, apply and report. A failed parity run returns to planning."><rect width="480" height="580" rx="16" fill="#FFFFFF"/><path d="M44 40V502" fill="none" stroke="#111111" stroke-width="2"/><circle cx="44" cy="40" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><text x="70" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Preflight</text><text x="70" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">Policy and fixtures present?</text><text x="456" y="37" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">SKILL.md</text><circle cx="44" cy="106" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><text x="70" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Check the dates</text><text x="70" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">Which records are unverified?</text><text x="456" y="103" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">verify_dates.py</text><circle cx="44" cy="172" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><text x="70" y="169" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Scan</text><text x="70" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">Retiring calls, soonest first</text><text x="456" y="169" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">scan.py</text><circle cx="44" cy="238" r="9" fill="#E11D48"/><text x="70" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Choose replacements</text><text x="70" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">You name each new model</text><text x="456" y="235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#E11D48">you</text><circle cx="44" cy="304" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><text x="70" y="301" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Plan</text><text x="70" y="320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">A diff. No source file changes</text><text x="456" y="301" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">plan_patch.py</text><circle cx="44" cy="370" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><text x="70" y="367" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Prove</text><text x="70" y="386" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">Your fixtures on both models</text><text x="456" y="367" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">parity.py</text><circle cx="44" cy="436" r="9" fill="#E11D48"/><text x="70" y="433" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Approve</text><text x="70" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">You read the diff and say yes</text><text x="456" y="433" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="end" fill="#E11D48">you</text><circle cx="44" cy="502" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><text x="70" y="499" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" text-anchor="start" fill="#111111">Apply and report</text><text x="70" y="518" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#52525B">Patch, then pr_body.md</text><text x="456" y="499" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="end" fill="#52525B">report.py</text><path d="M262 381H290V315H270" fill="none" stroke="#92400E" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M277 310L270 315L277 320" fill="none" stroke="#92400E" stroke-width="1.5"/><text x="300" y="337" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#92400E">exit 2: fix</text><text x="300" y="353" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#92400E">and replay</text><circle cx="44" cy="552" r="7" fill="#FFFFFF" stroke="#111111" stroke-width="3"/><text x="70" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#52525B">A script decides</text><circle cx="214" cy="552" r="9" fill="#E11D48"/><text x="234" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#52525B">Stops and waits for you</text></svg>
